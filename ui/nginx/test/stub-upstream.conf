# TPF-49: fixed upstream answers for error-passthrough.sh. Port 8086 stands in for the backend,
# 9080 for Keycloak. Each answer is a status the UI nginx's error_page lines name.
server {
    listen 8086;
    default_type application/json;
    location = /graphql {
        add_header Retry-After 7 always;
        return 429 '{"error":"Rate limit exceeded"}';
    }
    location = /api/programmatic/token {
        add_header WWW-Authenticate 'Basic realm="rearm"' always;
        add_header Cache-Control no-store always;
        return 401 '{"error":"invalid_client","error_description":"client authentication required (HTTP Basic with the API key id and secret)"}';
    }
    location = /api/programmatic/graphql {
        add_header WWW-Authenticate 'Bearer error="invalid_token"' always;
        add_header X-Rate-Limit-Remaining 42 always;
        return 401 '{"error":"invalid_token"}';
    }
    location = /api/stub/500 {
        return 500 '{"stub":"backend 500"}';
    }
    location = /api/stub/503 {
        add_header Retry-After 30 always;
        return 503 '{"stub":"backend 503"}';
    }
    location / {
        return 409 '{"stub":"backend"}';
    }
}
server {
    listen 9080;
    default_type application/json;
    location = /kauth/realms/Reliza/protocol/openid-connect/token {
        return 400 '{"error":"invalid_grant","error_description":"Token is not active"}';
    }
    location / {
        return 409 '{"stub":"keycloak"}';
    }
}
