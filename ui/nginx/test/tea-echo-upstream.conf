# TPF-148: upstream stand-ins for tea-custom-domains.sh. Port 8086 is the backend, 9080 Keycloak. Each
# answers 200 with what it received, so a row can check the Host, the forwarded headers and the raw URI
# the UI nginx sent. (stub-upstream.conf stays as it is: error-passthrough.sh compares its exact bodies.)
server {
    listen 8086;
    default_type application/json;
    location / {
        return 200 '{"stub":"backend","host":"$http_host","xfh":"$http_x_forwarded_host","xfp":"$http_x_forwarded_proto","uri":"$request_uri"}';
    }
}
server {
    listen 9080;
    default_type application/json;
    location / {
        return 200 '{"stub":"keycloak","host":"$http_host","uri":"$request_uri"}';
    }
}
