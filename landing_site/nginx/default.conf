server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Emit relative Location headers on nginx-generated redirects (notably the
    # built-in directory trailing-slash 301 for Astro's /page -> /page/ dirs).
    # Without this, nginx builds an absolute URL from the scheme IT sees -- and
    # since TLS terminates at the ingress, that's http://, downgrading
    # https://rearmhq.com/pricing -> http://rearmhq.com/pricing/ (plaintext hop
    # for non-HSTS clients, http canonical for crawlers). A relative
    # "Location: /pricing/" preserves whatever scheme the client used.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://cdn.rearmhq.com https://www.youtube.com https://youtube.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # the previous site served its sitemap at /sitemap.xml (still referenced by
    # search-engine caches); Astro's sitemap integration emits sitemap-index.xml
    location = /sitemap.xml {
        return 301 /sitemap-index.xml;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|ttf|otf|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}

