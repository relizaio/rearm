useTraefikLe: false
traefikBehindLb: true
ingressHost: dtrack.localhost

traefik_crd_api_version: traefik.io/v1alpha1

# HSTS (Strict-Transport-Security) is emitted by Traefik at the TLS edge, since
# TLS terminates at the ingress (useTraefikLe) or at an upstream LB
# (traefikBehindLb) rather than the frontend nginx. The non-TLS headers (CSP,
# X-Frame-Options, etc.) are set on that nginx instead, in
# mounted_files/nginx-conf.
#
# Off by default, unlike the ReARM chart: a browser honours HSTS for the whole
# max-age once it has seen it, so switching it on is effectively one-way for
# anyone who has already loaded the site. Turn it on deliberately, per host.
# includeSubdomains covers subdomains OF ingressHost only, not its siblings.
#
# NB: enabling this on an already-deployed release creates the Middleware
# during an upgrade, which leaves it client-side owned. The first later change
# to any value below then fails with a conflict against helm itself
# (`.spec.headers.stsSeconds` and friends); one `helm upgrade
# --force-conflicts` clears it permanently. Turning HSTS back off is
# unaffected, since that deletes the Middleware rather than changing it.
hsts:
  enabled: false
  maxAge: 31536000
  includeSubdomains: true
  preload: false

# Chart-managed secrets. One mode governs BOTH the postgres credentials
# (secret "pgpassword": POSTGRES_PASSWORD / username / password keys) and
# the DT5 key-encryption-key (secret "dtrack5-rearm-kek": kek key):
#
#   generated - values are generated on first install (helm `lookup` +
#               random) and never regenerated by later upgrades; the
#               Secrets carry helm.sh/resource-policy: keep so they also
#               survive `helm uninstall` and are reused on reinstall.
#               Recommended default. CAVEAT: `lookup` is a no-op under
#               `helm template` / --dry-run, so ArgoCD-style render
#               pipelines regenerate the values on every render — for
#               those use sealed (recommended) or plaintext (works, but
#               holding real secret material in values is not
#               recommended).
#   plaintext - Secrets are created verbatim from secrets.pgpassword /
#               secrets.kek below (generate the kek with
#               `openssl rand -base64 32`).
#   sealed    - SealedSecret resources from kubeseal ciphertext placed in
#               secrets.pgpassword / secrets.kek; requires the
#               sealed-secrets controller (>= v0.17).
#   none      - the chart creates nothing; provision Secrets "pgpassword"
#               and "dtrack5-rearm-kek" with the keys above out-of-band
#               (e.g. via an external secrets operator).
create_secret_in_chart: generated # generated, plaintext, sealed, none
sealed_secrets_scope: namespace-wide # namespace-wide, cluster-wide, strict
secrets:
  # plaintext mode: raw values; sealed mode: kubeseal ciphertext. Unused
  # (leave empty) in generated / none modes.
  pgpassword: ""
  kek: ""

postgres:
  enabled: true
  postgresStorage: 4G
images:
  postgresImage: registry.relizahub.com/library/rearm-postgres:0.1.3@sha256:3c52805d1d6d09147fd469dba80b7962ba051ba3f6ac15ed4962945b274bcd56
  pgbackups: registry.relizahub.com/library/cloud-backup:26.04.0@sha256:abae25e630892c60018e1d269f1d41db4f444a87c556ed41e69540c2337998ee
  pullPolicy: IfNotPresent

backups:
  enabled: false
  schedule: "0 1 * * *"
  prefix: "dtrack5"
  storageType: s3  # Options: s3, azure
  secretName: rearm-backup  # K8s secret used by DB backup cronjob
  pgHost: postgres
  pgDatabase: postgres
  pgUser: postgres
  # Requires rearm-backup secret with keys:
  # S3: aws-bucket, aws-region, aws-access-key-id, aws-secret-access-key
  # Azure: azure-storage-account, azure-tenant-id, azure-client-id, azure-client-secret, azure-container
  # Optional: encryption-password

dependency-track:
  # Deterministic service names (dtrack5-api-server, dtrack5-frontend)
  # regardless of release name — the wrapper's ingress and the frontend's
  # nginx /api proxy both rely on these.
  fullnameOverride: dtrack5

  database:
    # Points at the wrapper-managed postgres StatefulSet (templates/postgres.yaml).
    jdbcUrl: "jdbc:postgresql://postgres:5432/postgres?reWriteBatchedInserts=true"
    # Credentials come from the wrapper-managed pgpassword secret (see
    # create_secret_in_chart above; with mode "none", provision a secret
    # of the same name and layout). The api-server mounts the username /
    # password keys as files.
    existingSecret:
      name: pgpassword

  secretManagement:
    provider: database
    database:
      kek:
        mode: config
        existingSecret:
          # Created by templates/secret.yaml per create_secret_in_chart
          # (with mode "none", provision it out-of-band).
          name: dtrack5-rearm-kek
          key: kek

  apiServer:
    topology: monolith
    # The api-server neither retries a failed DB pool init nor exits the JVM
    # when it fails (the main thread dies but non-daemon threads keep the
    # container "Running"), so a fresh install that races postgres wedges
    # until the 30-min startup-probe budget lapses. Gate on postgres instead.
    initContainers:
      - name: wait-for-postgres
        image: busybox:1.37
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
    web:
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          memory: "4Gi"

  frontend:
    # Empty apiBaseUrl -> the UI issues relative /api requests, which the
    # frontend's own nginx proxies to the api-server (see
    # mounted_files/nginx-conf/default.conf.template). This keeps a single
    # externally exposed service, same as the dependency-track-helm (v4) wrapper.
    apiBaseUrl: ""
    extraEnv:
      - name: DTRACK_API_SERVICE
        value: dtrack5-api-server
    additionalVolumeMounts:
      - name: nginx-config
        mountPath: /etc/nginx/templates
    additionalVolumes:
      - name: nginx-config
        configMap:
          name: nginx-config
