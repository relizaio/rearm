{{/*
  DT5 key-encryption-key (KEK) secret for database-backed secret management,
  governed by the same create_secret_in_chart mode as the postgres secret
  (see values.yaml for the mode contract and the ArgoCD / helm-template
  caveat on `generated`).
*/}}
{{- $mode := .Values.create_secret_in_chart }}
{{- if eq $mode "generated" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "dtrack5-rearm-kek" }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: dtrack5-rearm-kek
  namespace: {{ .Release.Namespace }}
  annotations:
    # Survive `helm uninstall`: a lost KEK permanently orphans every
    # DT-encrypted secret in the database, so the Secret outlives the
    # release and is found + reused by `lookup` on reinstall.
    helm.sh/resource-policy: keep
data:
  {{- if and $existing $existing.data (index $existing.data "kek") }}
  kek: {{ index $existing.data "kek" }}
  {{- else }}
  {{- /* randBytes 32 == base64 of 32 random bytes, the same shape as
         `openssl rand -base64 32`. b64enc again because this is the
         data: (not stringData:) section. */}}
  kek: {{ randBytes 32 | b64enc | quote }}
  {{- end }}
{{- else if eq $mode "plaintext" }}
{{- if not .Values.secrets.kek }}
{{- fail "create_secret_in_chart=plaintext requires secrets.kek (generate with: openssl rand -base64 32)" }}
{{- end }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: dtrack5-rearm-kek
  namespace: {{ .Release.Namespace }}
stringData:
  kek: {{ .Values.secrets.kek | quote }}
{{- else if eq $mode "sealed" }}
{{- if not .Values.secrets.kek }}
{{- fail "create_secret_in_chart=sealed requires secrets.kek to carry kubeseal ciphertext" }}
{{- end }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dtrack5-rearm-kek
  namespace: {{ .Release.Namespace }}
  {{- if eq .Values.sealed_secrets_scope "namespace-wide" }}
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  {{- else if eq .Values.sealed_secrets_scope "cluster-wide" }}
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  {{- end }}
spec:
  encryptedData:
    kek: {{ .Values.secrets.kek | quote }}
{{- else if ne $mode "none" }}
{{- fail (printf "unknown create_secret_in_chart mode %q: use generated, plaintext, sealed, or none" $mode) }}
{{- end }}
