apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    name: rearm-ui
    app: rearm
    {{- include "rearm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.uiReplicaCount }}
  selector:
    matchLabels:
      {{- include "rearm.selectorLabels" . | nindent 6 }}
      name: rearm-ui-pod
  template:
    metadata:
      labels:
        {{- include "rearm.selectorLabels" . | nindent 8 }}
        servicehook: {{ .Release.Name }}-ui
        name: rearm-ui-pod
    spec:
      terminationGracePeriodSeconds: {{ .Values.uiService.terminationGracePeriodSeconds | default 30 }}
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      containers:
        - name: {{ .Chart.Name }}-ui
          image: "{{ .Values.image.uiImage }}"
          env:
            - name: HUB_HOST
              value: "{{ .Release.Name }}-backend-service"
            - name: HUB_PORT
              value: {{ .Values.backendService.port | quote }}
            - name: PROJECT_ORIGIN
              value: {{ .Values.projectProtocol }}://{{ .Values.projectHost }}
            {{- if .Values.keycloak.enabled}}
            - name: KEYCLOAK_HOST
              value: keycloak
            - name: KEYCLOAK_PORT
              value: "9080"
            {{- end}}
            - name: MAX_BODY_SIZE
              value: {{ .Values.max_upload_size_in_MB }}M
            - name: KEYCLOAK_ADMIN_ACCESS
              value: ""
            - name: KEYCLOAK_RELIZA_ADMIN_ACCESS
              value: ""
            - name: REARM_PRODUCT_VERSION
              value: {{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          lifecycle:
            preStop:
              # Sleep after the pod is removed from Service endpoints so in-flight and
              # just-routed requests still land here. Needed now that nginx actually
              # RECEIVES SIGTERM: for nginx SIGTERM means FAST shutdown (SIGQUIT is the
              # graceful one), so without this window it exits in milliseconds while
              # endpoint removal is still propagating, and the ingress serves 502s
              # mid-rollout -- costly for an SPA pulling many chunked assets.
              exec:
                command: ["sh", "-c", "sleep {{ .Values.uiService.preStopSleepSeconds | default 10 }}"]
          livenessProbe:
            httpGet:
              path: /error_pages/generic.html
              port: http
            failureThreshold: 1
            periodSeconds: 10
          readinessProbe:
            # Absent before: with only a livenessProbe the pod counted as Ready the
            # instant it started, so a rollout could route traffic at an nginx that was
            # not yet serving.
            httpGet:
              path: /error_pages/generic.html
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.uiService.resources | nindent 12 }}
