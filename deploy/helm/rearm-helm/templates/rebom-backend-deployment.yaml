apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rebom-backend
  namespace: {{ .Release.Namespace }}
  labels:
    name: rebom-backend
    app: rebom
    {{- include "rearm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.rebom.backend.replicaCount }}
  selector:
    matchLabels:
      app: rebom
      name: rebom-backend
      {{- include "rearm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        name: rebom-backend
        app: rebom
        {{- include "rearm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: rebom-backend-container
        image: {{ .Values.image.rebomBackend }}
        env:
        - name: REARM_PRODUCT_VERSION
          value: {{ .Chart.AppVersion | quote }}
        {{- $rebomNodeEnv := .Values.rebom.backend.nodeEnv | default "production" | toString }}
        {{- if not (has $rebomNodeEnv (list "production" "development")) }}
        {{- fail (printf "rebom.backend.nodeEnv: %q is not production or development." $rebomNodeEnv) }}
        {{- end }}
        - name: NODE_ENV
          value: {{ $rebomNodeEnv | quote }}
        - name: POSTGRES_HOST
          value: {{ if .Values.use_external_postgres }}{{ .Values.rebom_postgres_host }}{{ else }}{{ .Release.Name }}-rebom-postgres{{ end }}
        - name: POSTGRES_DATABASE
          value: {{ .Values.rebom_postgres_database }}
        - name: POSTGRES_USER
          value: {{ .Values.rebom_postgres_username }}
        - name: POSTGRES_PORT
          value: {{ .Values.rebom_postgres_port | quote }}
        - name: POSTGRES_SSL
          value: "{{ .Values.rebom_postgres_ssl }}"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-rebom-pgpassword
              key: password
        - name: OCI_STORAGE_ENABLED
          value: {{ .Values.rebom.backend.oci.enabled | quote }}
        - name: OCI_ARTIFACT_SERVICE_HOST
          value: {{ .Values.rebom.backend.oci.serviceHost }}
        - name: OCIARTIFACTS_REGISTRY_NAMESPACE
          value: {{ .Values.rebom.backend.oci.registryNamespace }}
        {{- $rebomChildEnvPassthrough := .Values.rebom.backend.childEnvPassthrough | default (list) }}
        {{- if not (kindIs "slice" $rebomChildEnvPassthrough) }}
        {{- fail "rebom.backend.childEnvPassthrough: must be a list of environment variable names." }}
        {{- end }}
        {{- range $i, $name := $rebomChildEnvPassthrough }}
        {{- if not (kindIs "string" $name) }}
        {{- fail (printf "rebom.backend.childEnvPassthrough: entry %d is not a string." (add $i 1)) }}
        {{- end }}
        {{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]{0,127}$" $name) }}
        {{- fail (printf "rebom.backend.childEnvPassthrough: entry %d is not an environment variable name (letters, digits and underscores, not starting with a digit, at most 128 characters)." (add $i 1)) }}
        {{- end }}
        {{- end }}
        {{- if $rebomChildEnvPassthrough }}
        - name: REBOM_CHILD_ENV_PASSTHROUGH
          value: {{ join "," $rebomChildEnvPassthrough | quote }}
        {{- end }}
        - name: ENRICHMENT_PENDING_IF_NOT_CONFIGURED
          value: {{ .Values.rebom.backend.enrichmentPendingIfNotConfigured | default "false" | quote }}
        - name: LOG_TYPE
          value: {{ .Values.rebom.backend.logFormatType | default "plain" | quote }}
        {{- $rebomLogLevel := .Values.rebom.backend.logLevel | default "" | toString }}
        {{- if $rebomLogLevel }}
        {{- if not (has $rebomLogLevel (list "trace" "debug" "info" "warn" "error" "fatal" "silent")) }}
        {{- fail (printf "rebom.backend.logLevel: %q is not trace, debug, info, warn, error, fatal or silent." $rebomLogLevel) }}
        {{- end }}
        - name: LOG_LEVEL
          value: {{ $rebomLogLevel | quote }}
        {{- end }}
        {{- if .Values.rebom.backend.rebomPropsSecretName }}
        envFrom:
        - secretRef:
            name: {{ .Values.rebom.backend.rebomPropsSecretName }}
        {{- end }}
        ports:
        - containerPort: 4000
      initContainers:
      - name: rebom-backend-init
        image: {{ .Values.image.rebomBackend }}
        command: ["cp", "-r", "/app/migrations/.", "/flyway/sql"]
        volumeMounts:
        - mountPath: /flyway/sql
          name: migrations-sql
      - name: rebom-backend-migrations
        image: {{ .Values.image.flywayImage }}
        env:
        - name: POSTGRES_JDBC
          value: {{ if .Values.use_external_postgres }}jdbc:postgresql://{{ .Values.rebom_postgres_host }}:5432/{{ .Values.rebom_postgres_database }}{{ else }}jdbc:postgresql://{{ .Release.Name }}-rebom-postgres:5432/postgres{{ end }}
        - name: POSTGRES_USER
          value: {{ .Values.rebom_postgres_username }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-rebom-pgpassword
              key: password
        # java4shell (CVE-2026-114938) mitigation; remove once the Flyway image
        # ships a JDK with the fix (Temurin 21.0.13.1+ or 25.0.5.1+).
        - name: JAVA_ARGS
          value: "-XX:-UseBASE64Intrinsics"
        command: ['/bin/sh', '-c', "/flyway/flyway -url=$POSTGRES_JDBC -user=$POSTGRES_USER -password=$POSTGRES_PASSWORD -defaultSchema=rebom -schemas=rebom migrate"]
        volumeMounts:
          - mountPath: "/flyway/sql"
            name: migrations-sql
      volumes:
        - name: migrations-sql
          emptyDir: {}