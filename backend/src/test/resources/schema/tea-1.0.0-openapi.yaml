# $schema: https://spec.openapis.org/oas/3.1/schema-base/2025-02-13
openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Transparency Exchange API
  summary: The OWASP Transparency Exchange API specification for consumers
  description: |
    The Transparency Exchange API (TEA) aims to facilitate the automated exchange
    of supply chain artifacts such as Software Bill of Materials (SBOM),
    Vulnerability Exploitability eXchange (VEX), and attestations,
    allowing users to automatically discover and consume transparency-related
    artifacts for a product. The TEA enhances transparency across the software
    supply chain by providing a standardized method to share and access critical
    security and compliance information. This automation benefits release management
    and optimizes procurement processes, ensuring timely updates and improving risk management.
    TEA is developed within the OWASP CycloneDX project and standardised in ECMA International
    technical Committee 54, task group 1.
  contact:
    name: ECMA International, TC54 tg1
    url: https://tc54.org/tea/
  license:
    name: Apache 2.0
    identifier: Apache-2.0
    # https://github.com/CycloneDX/transparency-exchange-api/blob/main/LICENSE
  version: 1.0.0
servers:
  - url: http://localhost/tea/v1.0.0
    description: Local development only; HTTPS is required outside local testing
paths:
  /discovery:
    get:
      description: |
        Discovery endpoint which resolves an identifier into one or more product release
        UUIDs.

        Exactly one of the `tei` and `purl` query parameters shall be provided. A request
        with neither, or with both, is rejected with `400`. OpenAPI cannot express this
        constraint on query parameters, so both are declared optional here.

        Discovery by TEI resolves the product across TEA servers, using the domain carried
        by the TEI (typically after DNS / `.well-known` selection of an API host).
        Discovery by PURL requires an already-known API base URL and resolves within that
        server's inventory.

        A successful response is a non-empty JSON array of `discovery-info` objects,
        ordered by priority when multiple product releases match (first entry highest).
        If the server does not resolve the identifier, it responds with `404` and
        `error: OBJECT_UNKNOWN`, not `200` with an empty array.

        Parameter values are the identifier itself (not a pre-encoded wire form). Clients
        shall apply query-parameter serialization once. Servers shall interpret the value
        after one query-decoding step. Escapes that are part of a PURL value are preserved
        by that single decode.

        Example request lines after serialization:
        - `.../discovery?tei=tei%3A%2F%2Fproducts.example.com%2Fuuid%2F47f51950-b0e2-11f1-adc2-1a52914d44b2`
        - `.../discovery?purl=pkg%3Amaven%2Forg.apache.logging.log4j%2Flog4j-core%402.24.3`

        Unlike `/token`, this operation is required on a conforming TEA API base for the
        advertised version. A conforming `404` uses the shared object-not-found response
        (`error-response`, typically `OBJECT_UNKNOWN`) and means this server does not resolve
        the identifier, not that `/discovery` is optional or unimplemented. Client
        recognition of that body and the terminal outcome are defined in the discovery
        document.
      summary: Resolve an identifier to TEA Product Releases
      operationId: discover
      parameters:
        - name: tei
          in: query
          required: false
          description: |
            Transparency Exchange Identifier (TEI) for the product being discovered, as the
            logical TEI string. Do not pre-encode for the schema example or client model;
            apply query-parameter encoding once when forming the HTTP request.
          schema:
            type: string
            examples:
              - tei://products.example.com/uuid/47f51950-b0e2-11f1-adc2-1a52914d44b2
        - name: purl
          in: query
          required: false
          description: |
            Package URL (PURL) of the product being discovered, resolved within this TEA
            server's inventory, as the logical PURL string. Do not pre-encode for the schema
            example or client model; apply query-parameter encoding once when forming the
            HTTP request.
          schema:
            type: string
            examples:
              - pkg:maven/org.apache.logging.log4j/log4j-core@2.24.3
      responses:
        '200':
          $ref: "#/components/responses/discovery-response"
        '400':
          $ref: "#/components/responses/400-invalid-request"
        '401':
          $ref: "#/components/responses/401-unauthorized"
        '403':
          $ref: "#/components/responses/403-forbidden"
        '404':
          $ref: "#/components/responses/404-object-by-id-not-found"
      tags:
        - TEA Discovery
  /products:
