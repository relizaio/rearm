                      algValue: 75b81020b3917cb682b1a7605ade431e062f7a4c01a412f0b87543b6e995ad2a

    collection-update-reason:
      type: object
      description: Reason for the update to the TEA collection
      properties:
        type:
          description: Type of update reason.
          "$ref": "#/components/schemas/collection-update-reason-type"
        comment:
          type: string
          description: Free text description
      required:
        - type
    collection-update-reason-type:
      type: string
      description: |
        Type of TEA collection update.

        `VEX_UPDATED` covers adding or revising an artifact of type `VULNERABILITIES`,
        including a revision whose external `url` or `signatureUrl` changed. VEX and VDR
        share that type. `ARTIFACT_UPDATED` covers a new revision of an artifact whose
        type is not `VULNERABILITIES`, including a revision whose external `url` or
        `signatureUrl` changed. Replacing an embedded artifact revision solely because its
        published `url` or `signatureUrl` changed is `VEX_UPDATED` when the artifact type
        is `VULNERABILITIES`, and `ARTIFACT_UPDATED` otherwise. Removing an artifact,
        including one of type `VULNERABILITIES`, counts as `ARTIFACT_REMOVED`.

        The first Collection version shall use `INITIAL_RELEASE`. In subsequent versions,
        adding or revising an artifact of type `VULNERABILITIES` counts as `VEX_UPDATED`.
        When multiple change kinds occur, the server shall select `updateReason.type`
        using the precedence rule below.

        When a collection version other than the first contains changes of more than one
        kind, the server shall set `updateReason.type` to the first applicable value in
        this order: `VEX_UPDATED`, `ARTIFACT_REMOVED`, `ARTIFACT_ADDED`, `ARTIFACT_UPDATED`.
        `comment` can describe the other changes. A client that needs the complete set of
        changes should compare the version with the previous one.
      enum:
        - INITIAL_RELEASE
        - VEX_UPDATED
        - ARTIFACT_UPDATED
        - ARTIFACT_ADDED
        - ARTIFACT_REMOVED

    collection-belongs-to-type:
      type: string
      description: Indicates whether a collection belongs to a component release or a product release
      enum:
        - COMPONENT_RELEASE
        - PRODUCT_RELEASE

    #
    # TEA Artifact and related objects
    #
    artifact:
      type: object
      description: A security-related document
      properties:
        uuid:
          description: The UUID of the TEA Artifact object. Together with *version* uniquely identifies the TEA Artifact.
          "$ref": "#/components/schemas/uuid"
        version:
          description: |
            Revision number, starting at 1 and incremented by 1 for each new revision of the same artifact UUID.
            Together with `uuid` uniquely identifies the TEA Artifact.
            Successive revisions cover content changes and changes to any published
            field, including external `url` or `signatureUrl` values. Each published
            revision is immutable. For a fixed artifact UUID, version, and format, the
            server shall ensure that successful content retrieval through its download
            endpoint, including retrieval after following redirects, yields unchanged
            artifact bytes after HTTP transfer coding and content coding are removed,
            and that successful signature retrieval through its signature download
            endpoint yields unchanged signature bytes on the same terms. Changing only
            a download response's `Location`, or only its HTTP content coding, while
            preserving those bytes, does not require a new artifact or collection version.
          type: integer
        name:
          type: string
          description: A human-readable name for the artefact
        type:
          description: Type of TEA Artifact
          "$ref": "#/components/schemas/artifact-type"
        createdDate:
          description: The date and time the TEA Artifact revision was created.
          "$ref": "#/components/schemas/date-time"
        distributionIds:
          type: array
          description: |
            Array of TEA Component Release distributions that this TEA Artifact applies to.
            If absent or empty, the TEA Artifact applies to all distributions.
          items:
            "$ref": "#/components/schemas/uuid"
            description: |
              The distribution IDs of the TEA component release distributions that this TEA Artifact applies to.
        formats:
          type: array
          minItems: 1
          description: |
            List of objects with the same content, but in different formats.
            The order of the list has no significance.
          items:
            "$ref": "#/components/schemas/artifact-format"
      required:
        - uuid
        - type
        - formats
        - createdDate
        - version
      examples:
        - uuid: 1cb47b95-8bf8-3bad-a5a4-0d54d86e10ce
          version: 2
          name: Build SBOM
          type: BOM
          createdDate: 2024-12-13T00:00:00Z
          formats:
            - mediaType: application/vnd.cyclonedx+xml
              description: CycloneDX SBOM (XML)
              url: https://repo.maven.apache.org/maven2/org/apache/logging/log4j/log4j-core/2.24.3/log4j-core-2.24.3-cyclonedx.xml
              signatureUrl: https://repo.maven.apache.org/maven2/org/apache/logging/log4j/log4j-core/2.24.3/log4j-core-2.24.3-cyclonedx.xml.asc
              checksums:
                - algType: SHA-256
                  algValue: e04c9d55986d7194822eaa4f8115a77f801844d807ad6e0d454ac31dd41861e5
                - algType: SHA-1
                  algValue: 5a7d4caef63c5c5ccdf07c39337323529eb5a770
        - uuid: dfa35519-9734-4259-bba1-3e825cf4be06
          version: 7
          name: Vulnerability Disclosure Report
          type: VULNERABILITIES
          createdDate: 2024-12-15T00:00:00Z
          formats:
            - mediaType: application/vnd.cyclonedx+xml
              description: CycloneDX VDR (XML)
              url: https://logging.apache.org/cyclonedx/vdr.xml
              checksums:
                - algType: SHA-256
                  algValue: 75b81020b3917cb682b1a7605ade431e062f7a4c01a412f0b87543b6e995ad2a
    artifact-type:
      type: string
      description: Type of TEA Artifact.
      enum:
        - ATTESTATION
        - BOM
        - BUILD_META
        - CERTIFICATION
        - FORMULATION
        - LICENSE
        - RELEASE_NOTES
        - SECURITY_TXT
        - THREAT_MODEL
        - VULNERABILITIES
        - OTHER
    artifact-format:
      type: object
      description: A security-related document in a specific format
      required:
        - mediaType
      dependentRequired:
        url:
          - checksums
      properties:
        mediaType:
          type: string
          description: |
            The Media Type of the document.

            A media type shall appear at most once across the `formats` of a single TEA
            Artifact revision, so that every format can be selected unambiguously by
            media type when downloading its content or its signature.
        description:
          type: string
          description: A free text describing the TEA Artifact
        url:
          type: string
          description: |
            External download URL for this format of the TEA Artifact.

            This is always a location outside the TEA API. When present, clients shall
            retrieve the content from it. When absent, the TEA server hosts the content
            itself and clients shall retrieve it from the artifact download endpoint,
            `/artifact/{uuid}/{artifactVersion}/download`, selecting this format by its
            `mediaType`.

            `url` and `signatureUrl` should be stable URLs. Servers should not publish
            pre-signed or otherwise expiring URLs in them. A server that serves content
            from expiring storage links shall omit them and answer from the download
            endpoints, with `302` where the bytes live elsewhere.

            A TEA access token is sent only to the TEA server's own API base URL, never
            to an external URL. External locations are either openly accessible or require
            credentials the client arranges separately.

            External `url` values are part of the published artifact revision. Changing
            `url` shall create a new artifact revision, even when content bytes and
            checksums are unchanged. The server shall preserve the URLs published on each
            historical artifact revision. If a Collection adopts that new revision,
            collection versioning follows `collection.version`.

            Byte stability for content retrieved through the server's download endpoint
            follows `artifact.version`.

            The TEA server does not control the bytes behind an external `url`, so for
            every format that has a `url` the server shall publish at least one checksum:
            the checksums are the integrity statement for the revision. Content retrieved
            from `url` that does not match them is not the content of that revision.
          format: uri
        signatureUrl:
          type: string
          description: |
            External download URL for a detached signature of this format of the TEA
            Artifact.

            As with `url`, this is always a location outside the TEA API. When present,
            clients shall retrieve the signature from it. When absent, clients shall
            retrieve it from the artifact signature download endpoint,
            `/artifact/{uuid}/{artifactVersion}/signature/download`, selecting this
            format by its `mediaType`; that endpoint returns `404` when no signature is
            published for the format. The same access-token, stable-URL, and revision rules
            as for `url` apply to `signatureUrl`. Byte stability for signature retrieval
            through the server's signature download endpoint follows `artifact.version`.

            This specification does not define which signature technology is used, nor
            model the signing algorithm, key, or certificate chain.
          format: uri
        checksums:
          type: array
          minItems: 1
          description: |
            Checksums for this artifact format's content bytes (the payload retrieved
            from `url` or from the artifact download endpoint for this `mediaType`),
            not the detached signature. When present, `checksums` shall contain at least
            one entry. When `url` is present, `checksums` is required. Those checksums are
            the integrity statement for that external `url`. Content retrieved from `url`
            that does not match them is not the content of that revision.

            Published checksums shall be calculated over the artifact format's bytes
            before HTTP content coding is applied. Clients verifying them shall first
            remove any HTTP transfer coding and content coding, and shall not otherwise
            transform or canonicalize the artifact bytes. An artifact that is itself
            compressed, such as a `.gz` file, stays in that form. The TEA servers
            shall not declare the artifact's own compression as HTTP content coding,
            because clients would then remove it and the checksum would not match.
          items:
            "$ref": "#/components/schemas/checksum"
    checksum:
      type: object
      description: |
        Integrity digest for identified content bytes. `algValue` is the lowercase
        hexadecimal encoding of the digest produced by `algType` over those bytes.
        The hex length shall match the algorithm's digest size (for example 40 for
        SHA-1, 64 for SHA-256 / SHA3-256 / BLAKE2b-256 / BLAKE3, 96 for SHA-384 /
        SHA3-384 / BLAKE2b-384, 128 for SHA-512 / SHA3-512 / BLAKE2b-512).
      properties:
        algType:
          description: Checksum algorithm
          "$ref": "#/components/schemas/checksum-type"
        algValue:
          type: string
          description: |
            Lowercase hexadecimal digest value for `algType`. Do not use Base64 or
            uppercase hex.
          pattern: '^[0-9a-f]+$'
          minLength: 40
          maxLength: 128
          example: 9da736a1cdd27231e70187cbc67398d29ca0b714f885e7032da9f1fb247693c1
      required:
        - algType
        - algValue
    checksum-type:
      type: string
      description: Checksum algorithm
      enum:
        - SHA-1
        - SHA-256
        - SHA-384
        - SHA-512
        - SHA3-256
        - SHA3-384
        - SHA3-512
        - BLAKE2b-256
        - BLAKE2b-384
        - BLAKE2b-512
        - BLAKE3
    unknown-error-type:
      type: string
      description: Classification of TEA error response
      enum:
        - OBJECT_UNKNOWN
        - NOT_IMPLEMENTED
        - NO_ACCEPTABLE_FORMAT
        - SIGNATURE_NOT_FOUND
        - INVALID_REQUEST
        - INVALID_PAGE_TOKEN
    #
    # Types used in API responses
    #
    error-response:
      type: object
      description: |
        TEA API error body. Servers shall emit exactly this shape: `error` is one of the
        values of `unknown-error-type`, and `message` is the only other property allowed.
        Clients recognize a TEA error by an `application/json` response whose body is a
        JSON object with a string `error` property. Other JSON 404 bodies are not TEA error
        responses.

        Any `4xx` from a resource endpoint may carry an `error-response` body; when
        present, `error` is from `unknown-error-type`. Clients shall not require a body.
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/unknown-error-type"
        message:
          type: string
          description: |
            Optional human-readable explanation for diagnostics. Clients shall not
            interpret it programmatically.
      required:
        - error

    server-info:
      type: object
      description: TEA server information including URL, versions, and optional priority
      additionalProperties: false
      properties:
        rootUrl:
          description: |
            Absolute API base URL for this TEA server, without trailing slash. Shall not
            include userinfo, query, or fragment. The scheme match is lowercase only
            (normalized form). Conforming deployments use lowercase `https`; `http` is
            allowed only so local-test documents still validate.
          type: string
          format: uri
          pattern: '^https?://[^/?#@]+(/[^?#\s]*[^/?#\s])?$'
          example: https://api.example.com
        versions:
          description: |
            Supported TEA API versions at this server, without a leading `v`. Each value
            is full SemVer 2.0.0 (MAJOR.MINOR.PATCH with optional prerelease and build
            metadata). Clients select the highest mutually supported version and append
            `/v` followed by that exact string.
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
            description: TEA OpenAPI Spec version identifier (full SemVer 2.0.0)
          example: ["1.0.0"]
        priority:
          description: |
            Optional priority for this server (0.0 to 1.0, where 1.0 is highest priority).
            If omitted in the JSON response, clients shall treat the effective priority as 1.0 when
            ordering servers (the same rule as for `.well-known/tea` endpoint `priority`).
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          default: 1.0
          example: 0.8
      required:
        - rootUrl
        - versions

    discovery-info:
      type: object
      description: |
        Discovery information for one product release matched by a TEI or PURL lookup.
        A successful `/discovery` response is a non-empty array of these objects, ordered
        by priority when more than one release matches (first entry highest).
        `.well-known/tea` selects where `/discovery` is called; `servers[]` lists API bases
        that serve this product release (same version and priority selection rules). A
        `rootUrl` need not appear in the well-known endpoint list.
      additionalProperties: false
      properties:
        productReleaseUuid:
          description: UUID of the resolved TEA Product Release
          $ref: "#/components/schemas/uuid"
          example: d4d9f54a-abcf-11ee-ac79-1a52914d44b1
        servers:
          description: |
            Non-empty array of TEA servers that serve this product release. Each entry
            has `rootUrl` (without trailing slash) and `versions`.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/server-info"
      required:
        - productReleaseUuid
        - servers

    #
    # CLE (Common Lifecycle Enumeration) objects
    # Based on ECMA-428 TC54 TG3 CLE Specification v1.0.0
    #
    cle-event-type:
      type: string
      description: The type of CLE lifecycle event
      enum:
        - released
        - endOfDevelopment
        - endOfSupport
        - endOfLife
        - endOfDistribution
        - endOfMarketing
        - supersededBy
        - componentRenamed
        - withdrawn
    cle-version-specifier:
      type: object
      description: |
        Which versions an event affects. Exactly one of `version` or `range`. `range` is an
        ECMA-428 version specification (`vers`). `version` names a single version without a
        `vers` scheme and is a TEA extension: it maps to `vers:<scheme>/<version>` when the
        ecosystem is known.
      properties:
        version:
          type: string
          description: A specific version string
        range:
          type: string
          description: A version range in vers format (e.g. "vers:npm/>=1.0.0|<2.0.0")
    cle-event:
      type: object
      description: |
        A discrete lifecycle event from the CLE specification (ECMA-428).

        CLE timestamps in TEA responses use the shared `date-time` schema: UTC with the
        `Z` designator, fractional seconds preserved. A `+00:00` offset in an upstream CLE
        document denotes the same instant and is re-expressed as `Z`. Any other offset is
        not UTC and is not valid CLE.
      properties:
        id:
          type: integer
          description: A unique, auto-incrementing integer identifier for the event
        type:
          description: The type of lifecycle event
          $ref: "#/components/schemas/cle-event-type"
        effective:
          description: When the event takes effect.
          "$ref": "#/components/schemas/date-time"
        published:
          description: When the event was first published.
          "$ref": "#/components/schemas/date-time"
        version:
          type: string
          description: Version string (used by released event type)
        versions:
          type: array
          description: List of version specifiers affected by this event
          items:
            $ref: "#/components/schemas/cle-version-specifier"
        supportId:
          type: string
          description: Reference to a support policy ID defined in the definitions section
        license:
          type: string
          description: License identifier (used by released event type)
        supersededByVersion:
          type: string
          description: Version string that supersedes the affected versions (used by supersededBy event type)
        identifiers:
          type: array
          description: |
            New identifiers for the component (`componentRenamed` only), in the TEA
            `identifier` shape. Corresponds to CLE `identifiers[]` with `type` / `value`.
          items:
            $ref: "#/components/schemas/identifier"
        eventId:
          type: integer
          description: ID of the event being withdrawn (used by withdrawn event type)
        reason:
          type: string
          description: Human-readable explanation (used by withdrawn event type)
        description:
          type: string
          description: Human-readable description of the event
        references:
          type: array
          description: List of URLs to supporting documentation
          items:
            type: string
            format: uri
      required:
        - id
        - type
        - effective
        - published
      examples:
        - id: 1
          type: released
          effective: "2024-01-01T00:00:00Z"
          version: "1.0.0"
          license: MIT
          published: "2023-06-01T00:00:00Z"
        - id: 3
          type: endOfSupport
          effective: "2024-01-01T00:00:00Z"
          versions:
            - version: "1.0.0"
          supportId: standard
          published: "2023-06-01T00:00:00Z"
    cle-support-definition:
      type: object
      description: A support policy definition from CLE
      properties:
        id:
          type: string
          description: Unique identifier for the support policy
        description:
          type: string
          description: Human-readable description of the policy
        url:
          type: string
          format: uri
          description: URL to detailed documentation about this support policy
      required:
        - id
        - description
      examples:
        - id: standard
          description: Standard product support policy
          url: https://example.com/support/standard
    cle-definitions:
      type: object
      description: Container for reusable CLE policy definitions
      properties:
        support:
          type: array
          description: List of support policies
          items:
            $ref: "#/components/schemas/cle-support-definition"
    cle:
      type: object
      description: |
        Lifecycle events for the object this endpoint is called on, as a TEA projection of
        the Common Lifecycle Enumeration (ECMA-428, 1st edition).

        This is not a CLE document. The document envelope (`$schema`, `identifier`,
        `updatedAt`, and `index` / `next` page chaining) is not carried: the TEA object the
        response belongs to supplies the identity, and TEA has its own pagination. The event
        vocabulary, ordering and semantics are those of ECMA-428; the field shapes are TEA's.
        A consumer that needs a CLE document applies the mapping rules below and adds the
        envelope; a producer that holds a CLE document applies them in reverse. Publishers
        that need a bit-identical CLE 1.0.0 document publish it as a TEA Artifact in a
        release collection, as artifact type `OTHER` until a dedicated type exists; the
        same artifact may be referenced from more than one collection. The CLE endpoints
        are not a substitute for that document.

        Mapping to ECMA-428:
        - `identifiers[]` on `componentRenamed` uses the TEA `identifier` shape (`idType`,
          `idValue`); CLE uses `type` / `value` with the same meaning.
        - A version specifier `{ version }` names one version without a `vers` scheme,
          because a TEA server does not always know the package ecosystem. It corresponds to
          the CLE range `vers:<scheme>/<version>` once the scheme is known. `{ range }` is a
          CLE range as-is.
        - `cle-event` is one flat object. The fields ECMA-428 requires or permits for each
          event type apply as written there; servers shall populate the required ones and
          omit fields that do not belong to the type.

        Selection. Servers shall return in `events` a subset of the events of the CLE data
        they hold for the component or product, and shall not alter an event beyond the
        mapping above. On a release endpoint, servers may omit events scoped to other
        versions: events whose `versions` do not cover the release's `version`, and
        `released` events whose `version` differs from it. Events that name no version,
        other than `withdrawn` events, apply to the component as a whole and are retained.
        Inclusion of `withdrawn` events follows the rule below. Servers shall not otherwise
        reduce the set, and in particular shall not collapse it to the latest event per
        type. Servers shall not renumber event `id` values. Servers shall include a
        `withdrawn` event if, and only if, they include the event it withdraws.
        `definitions.support` shall contain at least the policies referenced by the
        included events.

        `events` shall be ordered by `id` descending, as in ECMA-428. A server that provides CLE
        for an object answers `200`, with an empty `events` array when no event has been
        recorded yet. A server that does not provide CLE for the object answers `404` with
        `error: NOT_IMPLEMENTED`; `error: OBJECT_UNKNOWN` means the object itself is unknown.
      properties:
        events:
          type: array
          description: |
            Array of CLE Event objects representing lifecycle events. Events shall be ordered
            by id descending (newest events with highest IDs first).
          items:
            $ref: "#/components/schemas/cle-event"
        definitions:
          description: Container for reusable policy definitions referenced by events
          $ref: "#/components/schemas/cle-definitions"
      required:
        - events
      examples:
        - events:
            - id: 3
              type: endOfSupport
              effective: "2025-06-01T00:00:00Z"
              versions:
                - range: "vers:npm/>=1.0.0|<2.0.0"
              supportId: standard
              published: "2025-01-01T00:00:00Z"
            - id: 2
              type: endOfDevelopment
              effective: "2025-01-01T00:00:00Z"
              versions:
                - version: "1.0.0"
              supportId: standard
              published: "2024-06-01T00:00:00Z"
            - id: 1
              type: released
              effective: "2024-01-01T00:00:00Z"
              version: "1.0.0"
              license: Apache-2.0
              published: "2024-01-01T00:00:00Z"
          definitions:
            support:
              - id: standard
                description: Standard product support policy
                url: https://example.com/support/standard

    pagination-details:
      type: object
      properties:
        hasNext:
          type: boolean
          description: |
            A flag indicating whether there is another page of results to fetch.

            When `hasNext` is `true`, `nextPageToken` shall be present.
            When `hasNext` is `false`, `nextPageToken` shall not be included.
          default: false
        nextPageToken:
          type: string
          description: |
            An opaque token that can be used in a following request to retrieve the next page of results.

            This field shall be present when `hasNext` is `true`.
            This field shall not be included when `hasNext` is `false`.
      required:
        - hasNext
      examples:
        - hasNext: true
          nextPageToken: eyJwYWdlIjoiY29udGludWF0aW9uIn0
        - hasNext: false
    paginated-product-response:
      description: A paginated response containing TEA Products
      allOf:
        - $ref: "#/components/schemas/pagination-details"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/product"
          required:
            - results
      examples:
        - hasNext: true
          nextPageToken: eyJwYWdlIjoiY29udGludWF0aW9uIn0
          results: []
        - hasNext: false
          results: []
    paginated-product-release-response:
      description: A paginated response containing TEA Product Releases
      allOf:
        - $ref: "#/components/schemas/pagination-details"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/product-release"
          required:
            - results
      examples:
        - hasNext: true
          nextPageToken: eyJwYWdlIjoiY29udGludWF0aW9uIn0
          results: []
        - hasNext: false
          results: []
    paginated-component-response:
      description: A paginated response containing TEA Components
      allOf:
        - $ref: "#/components/schemas/pagination-details"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/component"
          required:
            - results
      examples:
        - hasNext: true
          nextPageToken: eyJwYWdlIjoiY29udGludWF0aW9uIn0
          results: []
        - hasNext: false
          results: []
    paginated-component-release-response:
      description: A paginated response containing TEA Component Releases
      allOf:
        - $ref: "#/components/schemas/pagination-details"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/component-release"
          required:
            - results
      examples:
        - hasNext: true
          nextPageToken: eyJwYWdlIjoiY29udGludWF0aW9uIn0
          results: []
        - hasNext: false
          results: []
    paginated-collection-response:
      description: A paginated response containing TEA Collections
      allOf:
        - $ref: "#/components/schemas/pagination-details"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/collection"
          required:
            - results
      examples:
        - hasNext: true
          nextPageToken: eyJwYWdlIjoiY29udGludWF0aW9uIn0
          results: []
        - hasNext: false
          results: []
    #
    # TEA Authentication
    #
    token-request:
      type: object
      description: |
        Token request for the `client_credentials` grant, as defined in RFC 6749 section
        4.4.2, or an optional assertion grant identified below. The `scope` parameter
        applies to both. The `assertion` parameter applies only to assertion grants.
        RFC 8693 token exchange is outside the TEA 1.0 profile (see `/token` description).
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          description: |
            OAuth 2.0 grant type. Servers shall support `client_credentials`. Servers may
            support assertion grants (`urn:ietf:params:oauth:grant-type:saml2-bearer`,
            `urn:ietf:params:oauth:grant-type:jwt-bearer`). Token exchange
            (`urn:ietf:params:oauth:grant-type:token-exchange`) is outside the TEA 1.0
            interoperable authentication profile; see `/token`.
          example: client_credentials
        scope:
          type: string
          description: |
            Optional space-delimited scope request (RFC 6749 section 3.3). TEA does not
            define scope values; servers may ignore this parameter.
        assertion:
          type: string
          description: Assertion value, when an assertion grant type is used (RFC 7521 section 4.1).
    token-response:
      type: object
      description: Successful token response, as defined in RFC 6749 section 5.1.
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
          description: |
            The issued access token, presented on other TEA endpoints as
            `Authorization: Bearer <access_token>`. Opaque to the client.
          example: 2YotnFZFEjr1zCsicMWpAA
        token_type:
          type: string
          description: Token type. Always `Bearer` in TEA.
          const: Bearer
        expires_in:
          type: integer
          description: |
            Lifetime of the access token in seconds. Servers should include this so that
            clients can re-authenticate before expiry rather than on failure.
          example: 3600
        scope:
          type: string
          description: Granted scope, when it differs from the scope requested.
    token-error-response:
      type: object
      description: Token error response, as defined in RFC 6749 section 5.2.
      required:
        - error
      properties:
        error:
          type: string
          description: Error code as defined in RFC 6749 section 5.2.
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
        error_description:
          type: string
          description: Human-readable text providing additional information about the error.
        error_uri:
          type: string
          format: uri
          description: URI of a human-readable web page with information about the error.

  headers:
    artifact-content-disposition:
      description: |
        Suggested filename for the artifact content, as an `attachment` disposition
        per RFC 6266.
      schema:
        type: string
        examples:
          - attachment; filename="log4j-core-2.24.3-cyclonedx.json"
    artifact-content-encoding:
      description: |
        HTTP content codings applied to the selected representation, listed in the
        order applied (RFC 9110). When no content coding is applied, the server should
        omit this header. An artifact's own compression, such as a `.gz` file, is not
        HTTP content coding and shall not be declared here.
      schema:
        type: string
        examples:
          - gzip
    artifact-etag:
      description: |
        The server shall provide a strong entity tag for the selected HTTP
        representation. Representations with different bytes shall have different
        strong entity tags, including representations that differ because of HTTP
        content coding. Artifact revision immutability does not require all HTTP
        representations of that revision to share an entity tag.

        Intermediaries that compress on the fly often weaken the entity tag, which does
        not meet this requirement. Servers that offer content coding can serve
        precompressed variants, or assign their own strong entity tag to each coded
        representation.
      required: true
      schema:
        type: string
    artifact-repr-digest:
      description: |
        When provided, `Repr-Digest` shall contain a digest of the complete selected
        HTTP representation data, including any applied content coding and excluding
        transfer coding, as defined in RFC 9530. It does not replace verification
        against the published checksums in the artifact metadata.
      schema:
        type: string
    artifact-cache-control-immutable:
      description: |
        Cache policy for a specific artifact or signature revision. Artifact and signature
        bytes remain unchanged after HTTP decoding. A server may use `immutable` only
        when the selected HTTP representation, including its content-coded bytes, will
        remain unchanged throughout the response's freshness lifetime. Otherwise, the
        server shall omit `immutable`.

        Responses containing access-controlled content shall use `Cache-Control`
        `private` or `no-store`. Servers shall use `public` only for content available
        without authorization. Immutability does not imply public accessibility (see
        RFC 9111 section 5.2.2.9).
      schema:
        type: string
        examples:
          - 'public, max-age=31536000, immutable'
          - 'private, max-age=31536000, immutable'
          - 'no-store'
    artifact-cache-control-latest:
      description: |
        The latest revision is a moving target: which revision it resolves to changes
        when a new revision is published. Servers shall not mark it immutable and
        shall require revalidation, so that a cache reuses a stored representation only
        after confirming, through that representation's `ETag`, that the selected
        representation has not changed.

        As with versioned downloads, responses containing access-controlled content
        shall use `private` or `no-store` (for example `private, no-cache`). Servers
        shall use `public` only for content available without authorization.
      required: true
      schema:
        type: string
        examples:
          - 'no-cache'
          - 'private, no-cache'
          - 'no-store'
    artifact-content-location:
      description: |
        Absolute URL of the versioned content download for the revision and format this
        response was resolved to, per RFC 9110 section 8.7. It includes the TEA API base,
        version path, and a `mediaType` query parameter naming the selected format. The
        URL identifies the revision and format. HTTP content coding can still be
        negotiated on a follow-up `GET`. A client that needs a stable reference to that
        revision and format uses this URL rather than the `latest` URL.
      required: true
      schema:
        type: string
        format: uri
        examples:
          - https://api.example.com/v1.0.0/artifact/2ff3ae7c-8eab-4e0b-9b8b-1a0c4c4c1c2d/3/download?mediaType=application%2Fvnd.cyclonedx%2Bjson
    artifact-vary:
      description: |
        If changing or removing the `Accept` request header could change the selected
        format for the same target URI, the server shall include `Accept` in `Vary`,
        including when `Accept` is absent or contains `*/*` (RFC 9110 section 12.5.5).
        An explicit `mediaType` query parameter can remove variation by `Accept` when
        it completely determines the format.

        If changing or removing the `Accept-Encoding` request header could change the
        selected content coding for the same target URI, the server shall include
        `Accept-Encoding` in `Vary`, including when `Accept-Encoding` is absent or the
        selected response uses no content coding. A `mediaType` query parameter does
        not eliminate variation by encoding.
      schema:
        type: string
        examples:
          - Accept
          - Accept-Encoding
          - Accept, Accept-Encoding
    signature-content-disposition:
      description: |
        Suggested filename for the signature, as an `attachment` disposition per
        RFC 6266.
      schema:
        type: string
        examples:
          - attachment; filename="log4j-core-2.24.3-cyclonedx.json.sig"
    signature-etag:
      description: |
        The server shall provide a strong entity tag for the selected HTTP
        representation. Representations with different bytes shall have different
        strong entity tags, including representations that differ because of HTTP
        content coding. Artifact revision immutability does not require all HTTP
        representations of that revision to share an entity tag. Content that is
        re-signed is published as a new revision. On-the-fly compression follows
        `artifact-etag`.
      required: true
      schema:
        type: string
    signature-content-location:
      description: |
        Absolute URL of the versioned signature download for the revision and format this
        response was resolved to, per RFC 9110 section 8.7. It includes the TEA API base,
        version path, and a `mediaType` query parameter naming the selected content
        format. The URL identifies the revision and format. HTTP content coding can
        still be negotiated on a follow-up `GET`.
      required: true
      schema:
        type: string
        format: uri
        examples:
          - https://api.example.com/v1.0.0/artifact/2ff3ae7c-8eab-4e0b-9b8b-1a0c4c4c1c2d/3/signature/download?mediaType=application%2Fvnd.cyclonedx%2Bjson
  responses:
    400-invalid-request:
      description: |
        Request was invalid. For paginated requests, this includes malformed, invalid,
        expired, or conflicting `pageToken` values, including conflicts with continuation
        parameters or path parameters (`error: INVALID_PAGE_TOKEN` when a TEA error body
        is present). Other malformed requests may use `error: INVALID_REQUEST`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-response"
          examples:
            invalidRequest:
              value: { error: INVALID_REQUEST }
            invalidPageToken:
              value: { error: INVALID_PAGE_TOKEN }
    401-unauthorized:
      description: |
        Authentication required, or the presented access token is expired, revoked, or
        otherwise invalid. Servers shall include a `WWW-Authenticate` header as defined
        in RFC 6750 section 3. On the `invalid_token` error a client may obtain a fresh
        token from `/token` and retry the request once (RFC 6750 section 3.1). The
        `WWW-Authenticate` challenge remains the primary signal; an `error-response` body
        is optional.

        Servers that require no authentication on any endpoint shall not return this
        status. On a TEA server where some data is available without authentication, but
        not all, protected endpoints return `401` when no valid token is presented;
        endpoints that do not require authentication answer without requiring a Bearer
        token. A protected object shall not answer `404` solely because the client is
        unauthenticated: absence of a valid token yields `401`, so the client flow can
        discover that authentication is required.
      headers:
        WWW-Authenticate:
          description: Bearer challenge, as defined in RFC 6750 section 3.
          required: true
          schema:
            type: string
            example: Bearer realm="tea", error="invalid_token", error_description="The access token expired"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-response"
    403-forbidden:
      description: |
        The client is authenticated, but is not authorized to access this resource or
        perform this operation. Authorization decisions are server-specific and are not
        constrained by this specification.

        Servers may instead conceal the existence of a resource from an authenticated
        but unauthorized client by answering `404` (see `404-object-by-id-not-found`).
        Clients shall treat `403` and that concealing `404` as non-access; neither
        implies that retrying with the same token will succeed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-response"
    artifact-content:
      description: |
        The content of the requested TEA Artifact format.

        The wire `Content-Type` is the `mediaType` of the format returned. The response
        content key is `*/*` because that type varies by format. `Content-Encoding`,
        when present, names the HTTP content coding of the selected representation.
        `Content-Location` identifies the revision and format; HTTP content coding can
        still be negotiated. `Vary` follows `artifact-vary`.
      headers:
        Content-Disposition:
          $ref: "#/components/headers/artifact-content-disposition"
        Content-Encoding:
          $ref: "#/components/headers/artifact-content-encoding"
        ETag:
          $ref: "#/components/headers/artifact-etag"
        Cache-Control:
          $ref: "#/components/headers/artifact-cache-control-immutable"
        Content-Location:
          $ref: "#/components/headers/artifact-content-location"
        Vary:
          $ref: "#/components/headers/artifact-vary"
        Repr-Digest:
          $ref: "#/components/headers/artifact-repr-digest"
      content:
        '*/*':
          schema:
            type: string
            format: binary
    artifact-content-latest:
      description: |
        The content of the selected format of the latest revision of the TEA Artifact,
        as resolved at the time of the request.

        Identical to `artifact-content` except for its cache policy: the latest revision
        changes when a new revision is published, so the response is not immutable and
        a cache shall revalidate it before reuse. Servers shall return a strong `ETag`
        for the selected HTTP representation. Revalidation returns `304 Not Modified`
        when `If-None-Match` matches that representation's validator. `Content-Location`
        identifies the revision and format. `Vary` follows the same rules as
        `artifact-content`.
      headers:
        Content-Disposition:
          $ref: "#/components/headers/artifact-content-disposition"
        Content-Encoding:
          $ref: "#/components/headers/artifact-content-encoding"
        ETag:
          $ref: "#/components/headers/artifact-etag"
        Cache-Control:
          $ref: "#/components/headers/artifact-cache-control-latest"
        Content-Location:
          $ref: "#/components/headers/artifact-content-location"
        Vary:
          $ref: "#/components/headers/artifact-vary"
        Repr-Digest:
          $ref: "#/components/headers/artifact-repr-digest"
      content:
        '*/*':
          schema:
            type: string
            format: binary
    artifact-signature-content:
      description: |
        The detached signature for the selected format of the TEA Artifact revision.

        The wire `Content-Type` is `application/octet-stream` unless the server knows a
        more specific media type for the signature it holds, in which case it returns
        that. The response content key is `*/*` because that type may vary. This
        specification does not require servers to identify the signature technology.
        `Content-Encoding`, when present, names the HTTP content coding of the selected
        representation. `Content-Location` identifies the revision and format; HTTP
        content coding can still be negotiated. `Vary` follows `artifact-vary`.
      headers:
        Content-Disposition:
          $ref: "#/components/headers/signature-content-disposition"
        Content-Encoding:
          $ref: "#/components/headers/artifact-content-encoding"
        ETag:
          $ref: "#/components/headers/signature-etag"
        Cache-Control:
          $ref: "#/components/headers/artifact-cache-control-immutable"
        Content-Location:
          $ref: "#/components/headers/signature-content-location"
        Vary:
          $ref: "#/components/headers/artifact-vary"
        Repr-Digest:
          $ref: "#/components/headers/artifact-repr-digest"
      content:
        '*/*':
          schema:
            type: string
            format: binary
    artifact-signature-content-latest:
      description: |
        The detached signature for the selected format of the latest revision of the TEA
        Artifact, as resolved at the time of the request.

        Identical to `artifact-signature-content` except for its cache policy: the latest
        revision changes when a new revision is published, so the response is not
        immutable and a cache shall revalidate it before reuse. Servers shall return a
        strong `ETag` for the selected HTTP representation. Revalidation returns
        `304 Not Modified` when `If-None-Match` matches that representation's validator.
        `Content-Location` identifies the revision and format. `Vary` follows the same
        rules as `artifact-signature-content`.
      headers:
        Content-Disposition:
          $ref: "#/components/headers/signature-content-disposition"
        Content-Encoding:
          $ref: "#/components/headers/artifact-content-encoding"
        ETag:
          $ref: "#/components/headers/signature-etag"
        Cache-Control:
          $ref: "#/components/headers/artifact-cache-control-latest"
        Content-Location:
          $ref: "#/components/headers/signature-content-location"
        Vary:
          $ref: "#/components/headers/artifact-vary"
        Repr-Digest:
          $ref: "#/components/headers/artifact-repr-digest"
      content:
        '*/*':
          schema:
            type: string
            format: binary
    304-not-modified:
      description: |
        The representation selected after negotiation has not changed (RFC 9110). The
        response body is empty. Servers shall repeat `ETag` and `Content-Location` from
        the would-be successful response for that representation, and shall repeat
        `Cache-Control` and `Vary` when the corresponding `200` carries them.
      headers:
        ETag:
          description: |
            Same `ETag` the server would have sent on `200` for this operation.
          required: true
          schema:
            type: string
        Cache-Control:
          description: |
            Same `Cache-Control` the server would have sent on `200` for this operation.
          schema:
            type: string
        Content-Location:
          description: |
            Same `Content-Location` the server would have sent on `200` for this
            operation.
          required: true
          schema:
            type: string
            format: uri
        Vary:
          description: |
            Same `Vary` the server would have sent on `200` for this operation, when
            used.
          schema:
            type: string
    artifact-content-redirect:
      description: |
        The selected representation is available at another location, for example object
        storage addressed by a pre-signed URL. The client follows the `Location` header.

        Changing only this response's `Location`, while preserving the artifact or
        signature bytes for the selected UUID, version, and format after HTTP content
        coding is removed, does not require a new artifact or collection version.
        Publishing a different external `url` or `signatureUrl` on the artifact
        metadata is a separate change and shall follow the
        `artifact-format` rules for those fields.

        A client shall not send its TEA access token when following a redirect to a
        different origin.
      headers:
        Location:
          description: Location the selected representation can be retrieved from.
          required: true
          schema:
            type: string
            format: uri
    406-no-acceptable-format:
      description: |
        The artifact revision exists, but has no format matching the requested
        `mediaType` or `Accept` header. Body is a TEA `error-response` with
        `error: NO_ACCEPTABLE_FORMAT`.

        `NO_ACCEPTABLE_FORMAT` reveals that the artifact revision exists. A server
        concealing an artifact from a client shall answer `404` with
        `error: OBJECT_UNKNOWN` for every sub-resource of it, formats included, instead
        of this status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-response"
          example:
            error: NO_ACCEPTABLE_FORMAT
    token-issued:
      description: Credentials accepted, access token issued
      headers:
        Cache-Control:
          description: Servers shall set `no-store` on token responses (RFC 6749 section 5.1).
          required: true
          schema:
            type: string
            example: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/token-response"
    400-token-error:
      description: |
        The token request was malformed, used an unsupported grant type, or the
        credentials presented were not valid for the requested grant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/token-error-response"
    401-token-error:
      description: |
        Client authentication failed (`error: invalid_client`). Returned instead of 400
        when the client attempted to authenticate using the `Authorization` header
        (RFC 6749 section 5.2). For the baseline Basic exchange this includes a missing
        or invalid `Authorization: Basic` credential. Servers shall include
        `WWW-Authenticate: Basic`.
      headers:
        WWW-Authenticate:
          description: Challenge indicating the client authentication methods supported by the token endpoint.
          required: true
          schema:
            type: string
            example: Basic realm="tea"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/token-error-response"
          example:
            error: invalid_client
    404-object-by-id-not-found:
      description: |
        Either the object is unknown to this server, or — where an endpoint documents it —
        the server does not provide an optional capability or sub-resource for that object.
        The cases are told apart by the TEA error body, never by the status alone:

        - `error: OBJECT_UNKNOWN` — no such object (or its existence is concealed from this
          client).
        - `error: NOT_IMPLEMENTED` — optional capability or endpoint not provided (for CLE:
          lifecycle data; for `/token`: the token endpoint is not implemented). CLE is
          optional in TEA; clients shall not treat this as a failure of the object itself
          where the capability is optional.
        - `error: SIGNATURE_NOT_FOUND` — the artifact revision and format exist, but no
          signature is published for that format. This reveals that the artifact exists; a
          server concealing an artifact shall answer `OBJECT_UNKNOWN` for every
          sub-resource of it, signatures included.

        Concealment applies only after authentication. A request to a protected object
        with no valid access token shall receive `401` (see `401-unauthorized`), not a
        concealing `404`. Clients shall not infer from `404` alone whether the object is
        absent, withheld, or lacking an optional capability or sub-resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-response"
          examples:
            unknown:
              value: { error: OBJECT_UNKNOWN }
            notImplemented:
              value: { error: NOT_IMPLEMENTED }
            signatureNotFound:
              value: { error: SIGNATURE_NOT_FOUND }
    discovery-response:
      description: |
        Non-empty array of discovery results for the requested TEI or PURL. Each element
        is a `discovery-info` object (`productReleaseUuid` plus `servers`). An empty array
        is not a valid success response; use `404` with `error: OBJECT_UNKNOWN` when the
        server does not resolve the identifier.
      content:
        application/json:
          schema:
            type: array
            minItems: 1
            items:
              $ref: "#/components/schemas/discovery-info"
    paginated-product:
      description: A paginated response containing TEA Products
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-product-response"
    paginated-product-release:
      description: A paginated response containing TEA Product Releases
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-product-release-response"
    paginated-component:
      description: A paginated response containing TEA Components
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-component-response"
    paginated-component-release:
      description: A paginated response containing TEA Component Releases
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-component-release-response"
    paginated-collection:
      description: A paginated response containing TEA Collections
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-collection-response"
                    
  parameters:
    # Artifact content
    artifact-media-type:
      name: mediaType
      description: |
        Selects which of the artifact revision's `formats` to return, by its `mediaType`.
        The parameter value is the media type itself (for example
        `application/vnd.cyclonedx+json`), not a pre-encoded wire form. Clients shall
        apply query-parameter serialization once. Servers shall interpret the value after
        one query-decoding step.

        Matching against a format's `mediaType` is case-insensitive for the type and
        subtype. Parameter names are compared case-insensitively; parameter values
        require exact equality. When omitted, the server selects a format using the
        request's `Accept` header per RFC 9110 section 12, and falls back to a format of
        its choice when `Accept` does not constrain the result. In either case the
        `Content-Type` of the response states which format was returned. An explicit
        `mediaType` can remove variation by `Accept` when it completely determines the
        format. When it does not, the server shall include `Accept` in `Vary` if
        changing or removing `Accept` could change the selected format, including when
        `Accept` is absent or contains `*/*`. A `mediaType` query parameter does not
        eliminate variation by `Accept-Encoding`; see `artifact-vary`.

        Example after serialization:
        `.../download?mediaType=application%2Fvnd.cyclonedx%2Bjson`
      in: query
      required: false
      schema:
        type: string
        examples:
          - application/vnd.cyclonedx+json
    artifact-signature-media-type:
      name: mediaType
      description: |
        Selects which of the artifact revision's `formats` the returned signature applies
        to, by that format's `mediaType`. This is the media type of the signed content,
        not of the signature. The parameter value is the media type itself, not a
        pre-encoded wire form. Clients shall apply query-parameter serialization once.
        Servers shall interpret the value after one query-decoding step.

        Matching against a format's `mediaType` is case-insensitive for the type and
        subtype. Parameter names are compared case-insensitively; parameter values
        require exact equality. When omitted, the server selects a format of its choice.
        Requests that need a specific format's signature should supply this parameter.
        Successful responses include `Content-Location` with a `mediaType` query
        parameter naming the selected content format. An explicit `mediaType` can
        remove variation by `Accept` when it completely determines the signed format.
        It does not eliminate variation by `Accept-Encoding`; see `artifact-vary`.

        Example after serialization:
        `.../signature/download?mediaType=application%2Fvnd.cyclonedx%2Bjson`
      in: query
      required: false
      schema:
        type: string
        examples:
          - application/vnd.cyclonedx+json
    if-none-match:
      name: If-None-Match
      description: |
        Conditional request validator (RFC 9110). For artifact and signature downloads,
        `ETag` is the only defined validator. Servers evaluate `If-None-Match` with the
        weak comparison function (RFC 9110 section 13.1.2) against the `ETag` of the
        representation selected after negotiation, including content-coding negotiation,
        and answer `304` when it matches. The corresponding `304` shall carry that
        representation's validator and shall carry `Vary` when the `200` would. When
        present, that `ETag` is a strong validator. Other validators are not defined for
        these operations.
      in: header
      required: false
      schema:
        type: string
    # Pagination
    page-size:
      name: pageSize
      description: The maximum number of results to return.
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        default: 25
    page-token:
      name: pageToken
      description: |
        An opaque continuation token produced by a previous response.
        This token shall be copied verbatim from the `nextPageToken` value returned by the previous response.
        Clients shall not parse, construct, or modify this token.

        The token represents continuation state for the original query, including
        `sortField`, `sortOrder`, result-affecting filters such as `idType` and `idValue`,
        and path parameters such as parent `uuid`.
        When `pageToken` is supplied, clients shall not change those result-affecting query
        parameters. Servers shall return `400 Bad Request` if supplied result-affecting query
        parameters conflict with the token state. To change any result-affecting parameter,
        clients shall start a new pagination sequence without `pageToken`.

        A `pageToken` is only valid with the same request path and same path parameter values
        used to obtain it. Clients shall not reuse a `pageToken` across different parent
        resource paths or different path `uuid` values. Servers shall return `400 Bad Request`
        when a `pageToken` is used with a different path or different path parameter values.

        Servers shall return `400 Bad Request` for malformed, invalid, expired, or conflicting
        `pageToken` values.
      in: query
      required: false
      schema:
        type: string
    sort-order:
      name: sortOrder
      description: |
        The direction of the sort.
        
        The default is `asc` for all paginated resources. Clients that need newest
        release or collection versions first can request `sortOrder=desc`.

        The selected sort order applies to both the primary `sortField` and the
        resource-specific deterministic secondary tie-breaker. For products, components,
        product releases, and component releases, the secondary key is `uuid`. For collections,
        the secondary key is `version` if additional tie-breaking is needed.
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    # Pagination Sort Fields per TEA Object Type
    sort-field-collection:
      name: sortField
      description: |
        The field by which to sort the results.

        Paginated collection results shall be ordered first by the selected `sortField`,
        then by `version` as the deterministic secondary key if additional tie-breaking
        is needed. Collection UUIDs are not used as tie-breakers because collection UUIDs
        match the associated release UUID and can be shared across collection revisions.

        The only currently supported collection `sortField` is `version`, so the secondary
        `version` key is redundant unless additional collection sort fields are added later.
      in: query
      required: false
      schema:
        type: string
        enum:
          - version
        default: version
    sort-field-component:
      name: sortField
      description: |
        The field by which to sort the results.

        Paginated results shall be ordered first by the selected `sortField`, then by `uuid`
        as a deterministic secondary tie-breaker.
      in: query
      required: false
      schema:
        type: string
        enum:
          - name
        default: name
    sort-field-component-release:
      name: sortField
      description: |
        The field by which to sort the results.

        Paginated results shall be ordered first by the selected `sortField`, then by `uuid`
        as a deterministic secondary tie-breaker.

        When `version` is selected, ordering is by the stored version string according to
        the server's documented string collation; semantic-version precedence is not implied.
        Servers shall apply a stable and deterministic string collation for version sorting,
        and the same collation shall be used consistently across pages for a pagination sequence.

        When `releaseDate` is selected, releases without a `releaseDate` shall be ordered
        consistently. Missing `releaseDate` values sort after populated `releaseDate` values
        for ascending order and before populated `releaseDate` values for descending order.
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdDate
          - releaseDate
          - version
        default: createdDate
    sort-field-product:
      name: sortField
      description: |
        The field by which to sort the results.

        Paginated results shall be ordered first by the selected `sortField`, then by `uuid`
        as a deterministic secondary tie-breaker.
      in: query
      required: false
      schema:
        type: string
        enum:
          - name
        default: name
    sort-field-product-release:
      name: sortField
      description: |
        The field by which to sort the results.

        Paginated results shall be ordered first by the selected `sortField`, then by `uuid`
        as a deterministic secondary tie-breaker.

        When `version` is selected, ordering is by the stored version string according to
        the server's documented string collation; semantic-version precedence is not implied.
        Servers shall apply a stable and deterministic string collation for version sorting,
        and the same collation shall be used consistently across pages for a pagination sequence.

        When `releaseDate` is selected, releases without a `releaseDate` shall be ordered
        consistently. Missing `releaseDate` values sort after populated `releaseDate` values
        for ascending order and before populated `releaseDate` values for descending order.
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdDate
          - releaseDate
          - version
        default: createdDate

    #
    # Query by identifier
    #
    # Since OpenAPI 3.0 it is possible to use RFC 6570-based serialization for JSON parameters of type array or object:
    #   https://swagger.io/docs/specification/v3_0/serialization/
    #
    # Unfortunately many tools don't support it, for example,
    # the `openapi-generator` for Java does not handle this correctly.
    #   https://github.com/OpenAPITools/openapi-generator/issues/4808
    #
    # This can be uncommented, when RFC 6570-base serialization reaches a wider adoption:
    #
    # identifier-param:
    #   name: identifierParam
    #   description: If present, only the objects with the given identifier will be returned.
    #   in: query
    #   schema:
    #     $ref: "#/components/schemas/identifier"
    #   style: form
    #   explode: true
    #
    # In the meantime we explode the object manually:
    id-type:
      # To allow RFC 6570 in the future without breaking changes to the HTTP API,
      # the name of this parameter should be identical to the equivalent property in /components/schemas/identifier
      name: idType
      description: Type of identifier specified in the `idValue` parameter
      in: query
      schema:
        $ref: "#/components/schemas/identifier-type"
    id-value:
      # To allow RFC 6570 in the future without breaking changes to the HTTP API,
      # the name of this parameter should be identical to the equivalent property in /components/schemas/identifier
      name: idValue
      description: If present, only the objects with the given identifier value will be returned.
      in: query
      schema:
        type: string

  # Component keys in this file are kebab-case. The two security scheme names keep the
  # camelCase spelling used throughout the OpenAPI ecosystem, because generated clients
  # surface them as the identifiers a caller configures credentials with.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A TEA access token obtained from `/token`, presented as
        `Authorization: Bearer <access_token>` (RFC 6750). This is the only credential
        accepted on TEA endpoints other than `/token`.

        Resource operations declare both this requirement and an empty alternative so
        that a server can select which objects require authentication: a client may call
        without a token. Whether a given endpoint actually requires a token is discovered at
        runtime from a `401` Bearer challenge (see `401-unauthorized`), not from this
        document alone. A server that requires no authentication shall ignore a presented
        Bearer token. A server that protects some objects but not all may leave some
        endpoints without authentication and protect others. Authorization after
        authentication (filtered views, `403`, or a concealing `404` for an authenticated
        but unauthorized client) remains server-specific. A protected object with no
        valid token shall answer `401`, not a concealing `404`.
    basicAuth:
      type: http
      scheme: basic
      description: |
        API key credentials, presented to `/token` only: the API key identifier as the
        user-id and the API key secret as the password (RFC 7617, RFC 6749 section
        2.3.1). Per RFC 6749 section 2.3.1, the identifier and secret are each encoded as
        `application/x-www-form-urlencoded` before they are joined with a colon and
        Base64-encoded for the `Authorization` header. Clients and servers shall apply
        that encoding so credentials containing `:`, `@`, or other reserved characters
        interoperate. Servers shall not accept API key credentials directly on other TEA
        endpoints; clients shall exchange them for an access token first.
security:
  # Bearer token, or no token (server or endpoint that does not require authentication).
  # Protected endpoints still answer 401 with a Bearer challenge when a valid token is required.
  - bearerAuth: []
  - {}
tags:
  - name: TEA Discovery
  - name: TEA Product
  - name: TEA Product Release
  - name: TEA Component
  - name: TEA Component Release
  - name: TEA Collection
  - name: TEA Artifact
  - name: CLE
  - name: TEA Authentication
    description: |
      Obtaining a TEA access token. Only a TEA server that requires authentication for
      some or all of its objects implements these operations; a server that requires no
      authentication need not. See `auth/readme.md`.
externalDocs:
  description: Transparency Exchange API specification
  url: https://github.com/CycloneDX/transparency-exchange-api
