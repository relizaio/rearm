    #
    # TEA Collection and related objects
    #
    collection:
      type: object
      description: |
        A collection of security-related documents.

        Every component release and product release has a collection. If no artifacts have
        been published when the release first becomes retrievable, the server serves version 1
        with an empty `artifacts` list and `updateReason.type: INITIAL_RELEASE`. That version
        is immutable like any other; the first artifacts are published as version 2.
      properties:
        uuid:
          description: |
            UUID of the TEA Collection object.
            A TEA Collection shall use the same UUID as its parent Product Release or
            Component Release. Within an API base, a Product Release and a
            Component Release shall not share a UUID. Consequently, Collections belonging
            to different parent releases have different UUIDs. Versions of the same
            Collection retain the same UUID. See `doc/tea-uuid-scope.md`.
          "$ref": "#/components/schemas/uuid"
        version:
          type: integer
          description: |
            TEA Collection version, incremented by 1 each time its content changes.
            Versions start with 1. Content changes include replacing an embedded artifact
            with a newer revision (for example one published because an external `url` or
            `signatureUrl` changed). If a Collection adopts that new artifact revision, the
            server shall publish a new Collection version. Previously published Collection
            versions shall remain unchanged. Classification of that adoption follows
            `collection-update-reason-type`.
        createdDate:
          description: The date when the TEA Collection version was created.
          "$ref": "#/components/schemas/date-time"
        belongsTo:
          description: Indicates whether this collection belongs to a Component Release or a Product Release
          "$ref": "#/components/schemas/collection-belongs-to-type"
        updateReason:
          description: Reason for the update/release of the TEA Collection object.
          "$ref": "#/components/schemas/collection-update-reason"
        artifacts:
          type: array
          description: Array of TEA Artifact objects (may be empty).
          items:
            "$ref": "#/components/schemas/artifact"
      required:
        - uuid
        - version
        - createdDate
        - belongsTo
        - updateReason
        - artifacts
      examples:
        # Documents in the latest release of Log4j Core (release da89e38e-...)
        - uuid: da89e38e-95e7-44ca-aa7d-f3b6b34c7fab
          version: 10
          createdDate: 2024-12-15T00:00:00Z
          belongsTo: COMPONENT_RELEASE
          updateReason:
            type: VEX_UPDATED
            comment: VDR file updated
          artifacts:
            - uuid: 1cb47b95-8bf8-3bad-a5a4-0d54d86e10ce
              createdDate: 2024-12-13T00:00:00Z
              version: 2
              name: Build SBOM
              type: BOM
              formats:
                - mediaType: application/vnd.cyclonedx+xml
                  description: CycloneDX SBOM (XML)
                  url: https://repo.maven.apache.org/maven2/org/apache/logging/log4j/log4j-core/2.24.3/log4j-core-2.24.3-cyclonedx.xml
                  signatureUrl: https://repo.maven.apache.org/maven2/org/apache/logging/log4j/log4j-core/2.24.3/log4j-core-2.24.3-cyclonedx.xml.asc
                  checksums:
                    - algType: SHA-256
                      algValue: e04c9d55986d7194822eaa4f8115a77f801844d807ad6e0d454ac31dd41861e5
                    - algType: SHA-1
                      algValue: 5a7d4caef63c5c5ccdf07c39337323529eb5a770
            - uuid: dfa35519-9734-4259-bba1-3e825cf4be06
              createdDate: 2024-12-15T00:00:00Z
              version: 7
              name: Vulnerability Disclosure Report
              type: VULNERABILITIES
              formats:
                - mediaType: application/vnd.cyclonedx+xml
                  description: CycloneDX VDR (XML)
                  url: https://logging.apache.org/cyclonedx/vdr.xml
                  checksums:
